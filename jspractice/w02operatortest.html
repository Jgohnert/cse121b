<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Operators</h1>
<h2>The + Operator</h2>
<h3>The in operator</h3>


<p id="demo"></p>
<p id="demo2"></p>
<p id="demo3"></p>

<script>

//The + operator concatenates (adds) strings

let text1 = "Good ";
let text2 = "Morning";
let text3 = text1 + text2;
document.getElementById("demo").innerHTML = text3;

//The typeof operator returns the type of a variable, object, function or expression

document.getElementById("demo2").innerHTML = 
"'John' is " + typeof "John" + "<br>" +
"3.14 is " + typeof 3.14 + "<br>" +
"NaN is " + typeof NaN + "<br>" +
"false is " + typeof false + "<br>" +
"[1, 2, 3, 4] is " + typeof [1, 2, 3, 4] + "<br>" +
"{name:'John', age:34} is " + typeof {name:'John', age:34} + "<br>" +
"new Date() is " + typeof new Date() + "<br>" +
"function () {} is " + typeof function () {} + "<br>" +
"myCar is " + typeof myCar + "<br>" +
"null is " + typeof null;

//The in operator returns true if a property is in an object, otherwise false:

const person = {firstName:"John", lastName:"Doe", age:50};
document.getElementById("demo3").innerHTML =
("firstName" in person) + "<br>" +
("age" in person) + "<br>" +
("address" in person);
</script>


</body>
</html>

Oper	Name	Example

Bit operators work on 32 bits numbers. Any numeric operand in the operation is
